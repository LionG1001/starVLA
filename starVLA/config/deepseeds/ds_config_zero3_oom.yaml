        "stage3_max_reuse_distance": 1e8,
        "stage3_gather_16bit_weights_on_model_save": true,
        "stage3_gather_16bit_weights_on_model_save": false,
        "round_robin_gradients": true
    },
    "gradient_clipping": 1.0,
    "steps_per_print": 10
