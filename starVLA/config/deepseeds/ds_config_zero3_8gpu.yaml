        "stage3_max_live_parameters": 5e7,
        "stage3_max_reuse_distance": 5e7,
        "stage3_gather_16bit_weights_on_model_save": false,
        "offload_optimizer": {
            "device": "cpu",
            "pin_memory": false
        },
        "offload_param": {
            "device": "cpu",
            "pin_memory": false
        }
    },
    "gradient_clipping": 1.0,
    "steps_per_print": 10
}
