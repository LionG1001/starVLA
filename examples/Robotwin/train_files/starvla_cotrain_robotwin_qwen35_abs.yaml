run_id: qwen35oft
run_root_dir: results/Checkpoints
seed: 42
# 默认只写本地 JSONL；如需上传实验指标，再将 wandb 加入 trackers。
trackers: [jsonl]
wandb_entity: your_wandb_entity
wandb_project: starVLA_Robotwin
is_debug: false

framework:
  name: QwenOFT
  qwenvl:
    # 当前内网 gl-vla 容器的权重路径；启动脚本仍可通过 BASE_VLM 覆盖。
    base_vlm: /data/share/liang.geng/vla-project/models/Qwen3.5-4B
    # 显式声明模型类型，避免自定义权重目录名不含“qwen3.5”时注册失败。
    model_type: qwen3_5
    # 这是 Qwen3.5 bs=4 性能优化的 attention 唯一配置源。基线固定使用 eager：
    # 它走 Transformers 显式注意力计算，不进入 PyTorch SDPA Flash/Math，
    # 也不进入 Mate/TileLang varlen adapter。基线启动脚本会校验该值。
    attn_implementation: eager
    # eager 路径不会读取该选项；保留 auto 仅用于完整记录配置。
    sdpa_backend: auto
    # FLA 线性注意力 fast path 已通过数值、三轮端到端和长稳门禁，优化配置默认开启。
    musa_fla_fastpath: true
    # Vision PatchEmbed 的 Conv3D→Linear 在真实 shape 上快约 48 倍；
    # 同代码 4 机配对训练改善约 0.64%。该低风险等价替换默认开启，
    # 设为 false 可立即回退原 Conv3D；参数和 state_dict 保持不变。
    musa_vision_patch_linear_fastpath: true
    # 仅将 vision/head_dim=64 切到 packed MUSA FlashAttention；文本仍为 eager。
    # 真实 12×256 packed shape 前后向快 4.08 倍，4 机配对训练改善 19.54%；
    # output/梯度和短训 loss 均 finite，且未调用 Mate，因此默认开启。
    musa_vision_flash_attention: true
    # Qwen3.5 会把原占位符 🔍 拆成 3 个 token。<|fim_pad|> 是官方
    # tokenizer 中的保留单 token；代码启动时还会验证连续重复后不被 BPE 合并。
    action_token: "<|fim_pad|>"
    vl_hidden_dim: 2560
  dino:
    dino_backbone: dinov2_vits14

  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 14
    state_dim: 14
    future_action_window_size: 49
    action_horizon: 50
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 2560
      positional_embeddings: null

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: asv2_conversation_en,asv2_detailed_description_en,asv2_region_captioning_en,coco_internvl_longcap_en,coco_karpathy_train_567_en,coco_negative_gpt4o_en,coco_poetry_zh,coco_rem_en_zh,cocorem_exist_yorn_en,cocotextv2_en,cocotextv2_gpt4o_en,okvqa_en,refcoco_grounding_aug_en,refcoco_grounding_en,tallyqa_coco_en,toloka_grounding_aug_en,vqav2_en,vsr_en
    eval_dataset: aokvqa_cauldron_llava_format
    data_flatten: false
    base_interval: 2
    max_pixels: 50176
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3_5
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    # 当前内网 gl-vla 容器的数据集路径；启动脚本仍可通过 DATA_ROOT_DIR 覆盖。
    data_root_dir: /data/share/liang.geng/vla-project/playground/Datasets/RoboTwin
    data_mix: robotwin_all_50
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 4
    load_all_data_for_training: true
    # bs=4 + FLA 后数据准备约占总 step 的 10%；用 4 个持久 worker 预取下一批。
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: false
    obs: ["image_0"]
    image_size: [224, 224]
    video_backend: pyav

trainer:
  # Experimental ZeRO-1 fast path: let MCCL average the existing contiguous
  # gradient bucket directly, avoiding a full BF16 pre-divide and rank-slice cat.
  musa_zero1_native_avg: true
  # 单卡 BF16 稠密理论峰值假设，仅作为 MFU 分母，不会自动探测。
  # S5000 的 1000 TFLOPS 是 FP8 口径；本 BF16 训练继续使用 460 TFLOPS。
  # 不要误用稀疏算力或整机总算力；可通过启动脚本 GPU_PEAK_TFLOPS 覆盖。
  gpu_peak_tflops: 460.0
  # 跳过冷启动后，使用最近 20 个 step 的累计 FLOPs/累计耗时打印稳态 MFU。
  mfu_warmup_steps: 10
  mfu_window_size: 20
  epochs: 100
  max_train_steps: 1000000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  repeated_diffusion_steps: 4
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
    # 当前 MTT S5000/torch_musa 版本上，Qwen3.5 的 native AdamW 比
    # FusedAdamW 更快；FusedAdamW 保留为显式 A/B 选项。
    fused: false
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
